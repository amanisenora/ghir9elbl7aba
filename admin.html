<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — GHIR9ELBL7ABA</title><style>body{font-family:Arial;background:#fff8fb;color:#24151e;margin:0}.wrap{max-width:900px;margin:auto;padding:20px}.box{background:#fff;border:1px solid #ead5df;border-radius:16px;padding:16px;margin:12px 0}input,select,textarea{width:100%;padding:11px;margin:5px 0 10px;border:1px solid #d9c2ce;border-radius:9px;box-sizing:border-box}button{padding:10px 13px;border:0;border-radius:9px;background:#7d284f;color:#fff;font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:14px;background:#f2e4eb;border-radius:12px}.item{border-top:1px solid #eee;padding:12px 0}.danger{background:#a3223b}.muted{color:#777;font-size:12px}</style></head><body><div class="wrap"><h1>GHIR9ELBL7ABA — Admin</h1><div class="box"><label>Mot de passe admin</label><input id="pass" type="password"><button onclick="login()">Connexion</button><span id="msg"></span></div><div id="app" style="display:none"><div class="grid" id="stats"></div><div class="box"><h2>Ajouter un produit</h2><form id="form"><input name="brand" placeholder="Brand"><input name="name" placeholder="Nom du produit" required><input name="category" placeholder="Catégorie" value="Vintage"><input name="size" placeholder="Taille"><input name="price" type="number" placeholder="Prix DA" required><input name="stock" type="number" placeholder="Stock" value="1"><textarea name="description" placeholder="Description"></textarea><input name="image" placeholder="URL image (optionnel)"><input name="file" type="file" accept="image/*"><button>Ajouter</button></form></div><div class="box"><h2>Produits</h2><div id="products"></div></div><div class="box"><h2>Commandes</h2><div id="orders"></div></div></div></div><script>let pw='';async function api(url,opt={}){opt.headers=Object.assign({},opt.headers,{'x-admin-password':pw});let r=await fetch(url,opt);let d=await r.json();if(!r.ok)throw Error(d.error||'Erreur');return d}async function login(){pw=pass.value;try{await api('/api/stats');app.style.display='block';msg.textContent=' ✓';refresh()}catch(e){msg.textContent=' Mot de passe incorrect'}}async function refresh(){let [s,p,o]=await Promise.all([api('/api/stats'),api('/api/products/all'),api('/api/orders')]);stats.innerHTML='<div class="stat"><b>'+s.products+'</b><br>Produits</div><div class="stat"><b>'+s.available+'</b><br>Disponibles</div><div class="stat"><b>'+s.orders+'</b><br>Commandes</div><div class="stat"><b>'+s.revenue.toLocaleString('fr-DZ')+' DA</b><br>CA commandes</div>';products.innerHTML=p.map(x=>'<div class="item"><b>'+x.name+'</b> — '+x.price.toLocaleString('fr-DZ')+' DA — taille '+(x.size||'-')+' — stock '+x.stock+'<br><button class="danger" onclick="del('+x.id+')">Supprimer</button></div>').join('')||'Aucun produit';orders.innerHTML=o.map(x=>'<div class="item"><b>'+x.order_no+'</b> — '+x.customer_name+' — '+x.phone+' — '+x.total.toLocaleString('fr-DZ')+' DA<br>'+x.wilaya+', '+x.commune+' — '+x.address+'<br><span class="muted">'+x.status+'</span> <select onchange="status('+x.id+',this.value)"><option>new</option><option>confirmed</option><option>shipped</option><option>completed</option><option>cancelled</option></select></div>').join('')||'Aucune commande'}form.onsubmit=async e=>{e.preventDefault();let fd=new FormData(form);let file=form.file.files[0];if(file)fd.set('image',file);else fd.delete('file');try{await fetch('/api/products',{method:'POST',headers:{'x-admin-password':pw},body:fd});form.reset();await refresh()}catch(err){alert(err.message)}}}async function del(id){if(confirm('Supprimer ce produit ?')){await api('/api/products/'+id,{method:'DELETE'});refresh()}}async function status(id,v){await api('/api/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:v})});refresh()}</script></body></html>
