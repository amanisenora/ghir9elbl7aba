<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — GHIR9ELBL7ABA</title><style>body{font-family:Arial;margin:0;background:#faf6f7;color:#281b21}header{background:#5b1735;color:white;padding:18px}main{max-width:1000px;margin:auto;padding:16px}.box{background:white;padding:16px;border-radius:15px;margin:12px 0;box-shadow:0 2px 12px #0001}input,textarea,select,button{font:inherit;padding:10px;border:1px solid #d7c8ce;border-radius:9px}input,textarea,select{width:100%;margin:5px 0 10px}button{cursor:pointer}.primary{background:#5b1735;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#f5dbe4;padding:14px;border-radius:12px}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}}.row{border-top:1px solid #eee;padding:12px 0}.danger{color:#9c1735}</style></head><body><header><b>GHIR9ELBL7ABA — ADMIN</b></header><main><div id="login" class="box"><h2>Connexion</h2><input id="pw" type="password" placeholder="Mot de passe admin"><button class="primary" onclick="login()">Entrer</button></div><div id="app" style="display:none"><div id="stats" class="stats"></div><div class="box"><h2>Ajouter un produit</h2><form id="form"><div class="grid"><input name="brand" placeholder="Marque"><input name="name" placeholder="Nom du produit *" required><input name="category" placeholder="Catégorie" value="Other"><input name="size" placeholder="Taille"><input name="price" type="number" placeholder="Prix DA *" required><input name="stock" type="number" placeholder="Stock" value="1"><textarea name="description" placeholder="Description"></textarea><input name="image" type="file" accept="image/*"></div><button class="primary">Ajouter</button></form></div><div class="box"><h2>Produits</h2><div id="products"></div></div><div class="box"><h2>Commandes</h2><div id="orders"></div></div></div></main><script>let pw='';const $=x=>document.getElementById(x);function hdr(){return {'x-admin-password':pw}}async function login(){pw=$('pw').value;const r=await fetch('/api/stats',{headers:hdr()});if(!r.ok){alert('Mot de passe incorrect');return}$('login').style.display='none';$('app').style.display='block';refresh()}async function refresh(){const s=await fetch('/api/stats',{headers:hdr()}).then(r=>r.json());$('stats').innerHTML=`<div class="stat"><b>${s.products}</b><br>Produits</div><div class="stat"><b>${s.available}</b><br>Pièces en stock</div><div class="stat"><b>${s.orders}</b><br>Commandes</div><div class="stat"><b>${s.revenue} DA</b><br>CA commandes</div>`;const ps=await fetch('/api/products/all',{headers:hdr()}).then(r=>r.json());$('products').innerHTML=ps.length?ps.map(p=>`<div class="row"><b>${p.brand||''} ${p.name}</b> — ${p.price} DA — taille ${p.size||'—'} — stock <input style="width:80px" id="st${p.id}" value="${p.stock}"><button onclick="save(${p.id})">Sauver</button> <button class="danger" onclick="del(${p.id})">Supprimer</button></div>`).join(''):'Aucun produit.';const os=await fetch('/api/orders',{headers:hdr()}).then(r=>r.json());$('orders').innerHTML=os.length?os.map(o=>`<div class="row"><b>${o.order_no}</b> — ${o.customer_name} — ${o.phone}<br>${o.wilaya}, ${o.commune} — ${o.total} DA<br>${o.items.map(i=>`${i.name} ×${i.qty}`).join(', ')}<br><select onchange="status(${o.id},this.value)">${['new','confirmed','shipped','completed','cancelled'].map(x=>`<option ${o.status===x?'selected':''}>${x}</option>`).join('')}</select></div>`).join(''):'Aucune commande.'}async function save(id){await fetch('/api/products/'+id,{method:'PATCH',headers:{...hdr(),'Content-Type':'application/json'},body:JSON.stringify({stock:Number($('st'+id).value)})});refresh()}async function del(id){if(!confirm('Supprimer ce produit ?'))return;await fetch('/api/products/'+id,{method:'DELETE',headers:hdr()});refresh()}async function status(id,status){await fetch('/api/orders/'+id,{method:'PATCH',headers:{...hdr(),'Content-Type':'application/json'},body:JSON.stringify({status})});refresh()}$('form').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);const r=await fetch('/api/products',{method:'POST',headers:hdr(),body:fd});if(!r.ok){alert((await r.json()).error||'Erreur');return}e.target.reset();refresh()};</script></body></html>
