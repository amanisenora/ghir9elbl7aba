<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — GHIR9ELBL7ABA</title><style>body{margin:0;background:#f8f1f5;font-family:Arial;color:#24151d}.top{background:#210d18;color:#fff;padding:22px}.wrap{max-width:1000px;margin:auto;padding:20px}.box{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 8px 25px #0000000c}input,select,textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px;margin:5px 0 10px;box-sizing:border-box}button{border:0;border-radius:9px;padding:10px 14px;background:#6f204e;color:#fff;font-weight:700}.danger{background:#9b253d}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#f4e8ef;padding:15px;border-radius:12px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:12px 0}.thumb{width:70px;height:80px;object-fit:cover;border-radius:8px;background:#eee}.muted{color:#777;font-size:13px}@media(min-width:700px){.grid,.stats{grid-template-columns:repeat(4,1fr)}}</style></head><body><div class="top"><b>GHIR9ELBL7ABA — ADMIN</b></div><main class="wrap"><div id="login" class="box"><h2>Accès privé</h2><input id="pw" type="password" placeholder="Mot de passe admin"><button onclick="login()">Entrer</button><p class="muted">Le mot de passe est celui défini dans Render → Environment.</p></div><div id="app" style="display:none"><div class="stats" id="stats"></div><div class="box"><h2>Ajouter une pièce</h2><form onsubmit="addProduct(event)"><div class="grid"><div><label>Marque</label><input name="brand" placeholder="Lacoste"></div><div><label>Nom</label><input name="name" required placeholder="Vintage Polo"></div><div><label>Catégorie</label><input name="category" placeholder="Polo"></div><div><label>Taille</label><input name="size" placeholder="M"></div><div><label>Prix DA</label><input name="price" type="number" required></div><div><label>Stock</label><input name="stock" type="number" min="0" required value="1"></div></div><label>Description</label><textarea name="description"></textarea><label>Photo</label><input name="image" type="file" accept="image/*" required><button>Ajouter la pièce</button></form></div><div class="box"><h2>Produits</h2><div id="products"></div></div><div class="box"><h2>Commandes</h2><div id="orders"></div></div></div></main><script>let PW='';function H(){return {'x-admin-password':PW}}async function login(){PW=pw.value;const r=await fetch('/api/stats',{headers:H()});if(!r.ok){alert('Mot de passe incorrect');return}login.style.display='none';app.style.display='block';refresh()}async function refresh(){const [s,p,o]=await Promise.all([fetch('/api/stats',{headers:H()}),fetch('/api/products'),fetch('/api/orders',{headers:H()})]);const st=await s.json(),ps=await p.json(),os=await o.json();stats.innerHTML=`<div class="stat"><b>${st.products}</b><br>Produits</div><div class="stat"><b>${st.inStock}</b><br>Pièces en stock</div><div class="stat"><b>${st.newOrders}</b><br>Nouvelles commandes</div><div class="stat"><b>${new Intl.NumberFormat('fr-DZ').format(st.sales)} DA</b><br>Ventes</div>`;products.innerHTML=ps.map(p=>`<div class="row"><div style="display:flex;gap:12px;align-items:center"><img class="thumb" src="${p.image||''}"><div><b>${p.name}</b><div class="muted">${p.brand||''} · ${p.size} · ${p.price} DA · stock ${p.stock}</div></div></div><button class="danger" onclick="del('${p.id}')">Supprimer</button></div>`).join('')||'<p class="muted">Aucun produit.</p>';orders.innerHTML=os.map(o=>`<div class="row"><div><b>${o.orderNo}</b> — ${o.customerName}<div class="muted">${o.phone} · ${o.wilaya} ${o.commune||''} · ${o.total} DA</div><div>${o.items.map(i=>`${i.name} × ${i.qty}`).join(' · ')}</div></div><select onchange="status('${o.id}',this.value)"><option ${o.status==='new'?'selected':''}>new</option><option ${o.status==='confirmed'?'selected':''}>confirmed</option><option ${o.status==='shipped'?'selected':''}>shipped</option><option ${o.status==='delivered'?'selected':''}>delivered</option><option ${o.status==='cancelled'?'selected':''}>cancelled</option></select></div>`).join('')||'<p class="muted">Aucune commande.</p>'}async function addProduct(e){e.preventDefault();const f=new FormData(e.target);const r=await fetch('/api/products',{method:'POST',headers:H(),body:f});if(!r.ok){alert(await r.text());return}e.target.reset();alert('Produit ajouté ✅');refresh()}async function del(id){if(!confirm('Supprimer cette pièce ?'))return;await fetch('/api/products/'+id,{method:'DELETE',headers:H()});refresh()}async function status(id,v){await fetch('/api/orders/'+id,{method:'PATCH',headers:{...H(),'Content-Type':'application/json'},body:JSON.stringify({status:v})});refresh()}</script></body></html>
