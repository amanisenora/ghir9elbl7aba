<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GHIR9ELBL7ABA — Thrift & Vintage</title><style>
:root{--wine:#6f204e;--dark:#210d18;--pink:#fff8fb;--muted:#777}*{box-sizing:border-box}body{margin:0;background:var(--pink);color:#20151a;font-family:Arial,sans-serif}header{background:var(--dark);color:#fff;padding:24px 20px;position:sticky;top:0;z-index:5}header b{font-size:24px;letter-spacing:3px}header small{display:block;color:#d9b9ca;margin-top:7px;letter-spacing:1px}.wrap{max-width:1050px;margin:auto;padding:28px 18px 100px}.hero{background:linear-gradient(135deg,#641b47,#a94778);color:white;border-radius:28px;padding:42px 28px;margin-bottom:26px}.hero h1{font-size:44px;line-height:1.05;margin:0 0 16px}.hero p{font-size:18px;max-width:520px}.cats{display:flex;gap:9px;overflow:auto;margin:10px 0 24px}.cat{border:1px solid #ddd;background:#fff;border-radius:999px;padding:11px 18px;white-space:nowrap}.cat.active{background:var(--wine);color:#fff;border-color:var(--wine)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 8px 25px #5b173014}.pic{aspect-ratio:1/1.12;background:#eee;display:flex;align-items:center;justify-content:center;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.noimg{font-size:50px;color:#aaa}.info{padding:14px}.brand{font-size:11px;color:#a04b74;letter-spacing:1px;text-transform:uppercase}.name{font-weight:700;margin:5px 0}.meta{font-size:13px;color:#777}.price{font-size:20px;font-weight:800;margin:10px 0}.btn{width:100%;border:0;border-radius:12px;background:var(--wine);color:white;padding:12px;font-weight:700}.empty{text-align:center;color:#888;padding:80px 20px}.cart{position:fixed;right:18px;bottom:18px;background:var(--wine);color:#fff;border:0;border-radius:999px;padding:15px 20px;box-shadow:0 10px 30px #0003;font-weight:700}.overlay{display:none;position:fixed;inset:0;background:#0008;z-index:20}.sheet{background:#fff;position:absolute;right:0;top:0;height:100%;width:min(440px,100%);padding:22px;overflow:auto}.close{float:right;border:0;background:#eee;border-radius:50%;width:38px;height:38px}.item{display:flex;gap:12px;border-bottom:1px solid #eee;padding:14px 0}.item img{width:65px;height:75px;object-fit:cover;border-radius:10px;background:#eee}.item b{display:block}.qty{margin-top:8px}.qty button{border:1px solid #ddd;background:#fff;border-radius:7px;padding:5px 10px}.total{font-size:22px;font-weight:800;margin:20px 0}.form input,.form select,.form textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0 10px;font-size:16px}.success{background:#f4e8ef;border-radius:16px;padding:20px;margin-top:15px}.adminlink{display:block;text-align:center;margin-top:30px;color:#777;font-size:12px}@media(min-width:800px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><header><b>GHIR9ELBL7ABA</b><small>THRIFT • VINTAGE • ONE PIECE</small></header><main class="wrap"><section class="hero"><h1>Find your next<br>vintage piece.</h1><p>Des pièces uniques sélectionnées une par une.</p></section><div class="cats" id="cats"></div><section class="grid" id="grid"></section><a class="adminlink" href="/admin.html">Administration</a></main><button class="cart" onclick="openCart()">🛍️ Panier <span id="count">0</span></button><div class="overlay" id="overlay"><aside class="sheet"><button class="close" onclick="closeCart()">×</button><h2>Votre panier</h2><div id="cartItems"></div><div class="total" id="total">Total : 0 DA</div><div id="checkout"><h3>Commander</h3><form class="form" onsubmit="order(event)"><input id="customerName" placeholder="Nom et prénom" required><input id="phone" placeholder="Téléphone" required><input id="wilaya" placeholder="Wilaya" required><input id="commune" placeholder="Commune"><textarea id="address" placeholder="Adresse / point de livraison"></textarea><select id="delivery"><option value="home">Livraison à domicile</option><option value="pickup">Point de retrait</option></select><button class="btn">Confirmer la commande</button></form></div><div id="success"></div></aside></div><script>
let products=[],cart=JSON.parse(localStorage.getItem('gh_cart')||'[]'),cat='All';const money=n=>new Intl.NumberFormat('fr-DZ').format(n)+' DA';
async function load(){const r=await fetch('/api/products');products=await r.json();cats();render()}function cats(){let c=['All',...new Set(products.map(p=>p.category))];document.getElementById('cats').innerHTML=c.map(x=>`<button class="cat ${x===cat?'active':''}" onclick="cat=${JSON.stringify(x)};cats();render()">${x}</button>`).join('')}
function render(){const arr=products.filter(p=>cat==='All'||p.category===cat);document.getElementById('grid').innerHTML=arr.length?arr.map(p=>`<article class="card"><div class="pic">${p.image?`<img src="${p.image}" alt="${p.name}">`:'<span class="noimg">👕</span>'}</div><div class="info"><div class="brand">${p.brand||'Vintage'}</div><div class="name">${p.name}</div><div class="meta">Taille : ${p.size}</div><div class="price">${money(p.price)}</div><button class="btn" onclick="add('${p.id}')">Commander</button></div></article>`).join(''):'<div class="empty" style="grid-column:1/-1">Aucune pièce disponible pour le moment.</div>'}
function save(){localStorage.setItem('gh_cart',JSON.stringify(cart));document.getElementById('count').textContent=cart.reduce((s,x)=>s+x.qty,0)}function add(id){const p=products.find(x=>x.id===id);if(!p)return;const x=cart.find(x=>x.id===id);if(x)x.qty++;else cart.push({id,qty:1});save();openCart()}function openCart(){document.getElementById('overlay').style.display='block';drawCart()}function closeCart(){document.getElementById('overlay').style.display='none'}function drawCart(){const el=document.getElementById('cartItems');let total=0;el.innerHTML=cart.map(x=>{const p=products.find(p=>p.id===x.id);if(!p)return '';total+=p.price*x.qty;return `<div class="item"><img src="${p.image||''}"><div><b>${p.name}</b><span>${money(p.price)} · ${p.size}</span><div class="qty"><button onclick="chg('${p.id}',-1)">−</button> ${x.qty} <button onclick="chg('${p.id}',1)">+</button></div></div></div>`}).join('')||'<p>Panier vide.</p>';document.getElementById('total').textContent='Total : '+money(total)}function chg(id,n){const x=cart.find(x=>x.id===id);if(!x)return;x.qty+=n;if(x.qty<=0)cart=cart.filter(y=>y.id!==id);save();drawCart()}async function order(e){e.preventDefault();if(!cart.length)return;const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customerName:customerName.value,phone:phone.value,wilaya:wilaya.value,commune:commune.value,address:address.value,delivery:delivery.value,items:cart})});const j=await r.json();if(!r.ok){alert(j.error||'Erreur');return}cart=[];save();document.getElementById('checkout').style.display='none';document.getElementById('success').innerHTML=`<div class="success"><h3>Commande confirmée ✅</h3><p>Numéro : <b>${j.orderNo}</b></p><p>Total : <b>${money(j.total)}</b></p><p>احتافظي برقم الطلب.</p></div>`;drawCart();load()}save();load();
</script></body></html>
