<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GHIR9ELBL7ABA — Thrift & Vintage</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff8fb;color:#24151e;font-family:Arial,sans-serif}.top{background:#23101b;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}.brand{font-weight:900;letter-spacing:2px;font-size:22px}.sub{font-size:11px;color:#e9b8cf;margin-top:3px}.wrap{max-width:1100px;margin:auto;padding:18px 14px}.hero{background:linear-gradient(135deg,#4a1935,#9e426e);color:white;border-radius:22px;padding:28px 20px;margin-bottom:18px}.hero h1{margin:0;font-size:34px}.hero p{margin:8px 0 0;color:#ffe8f2}.tools{display:flex;gap:8px;overflow:auto;margin:10px 0 18px}.tools button{border:1px solid #e2c3d0;background:white;border-radius:999px;padding:10px 15px;white-space:nowrap}.tools button.active{background:#7d284f;color:white}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#fff;border:1px solid #efd9e2;border-radius:16px;overflow:hidden;box-shadow:0 4px 16px #5b1d3710}.pic{aspect-ratio:1/1;background:#f2e8ed;position:relative;display:flex;align-items:center;justify-content:center}.pic img{width:100%;height:100%;object-fit:cover}.tag{position:absolute;top:9px;left:9px;background:#fff;border-radius:8px;padding:5px 7px;font-size:11px;font-weight:800}.info{padding:11px}.brandx{font-size:10px;text-transform:uppercase;color:#a05a78;letter-spacing:1px}.name{font-weight:800;margin:3px 0}.meta{font-size:11px;color:#777}.price{font-weight:900;font-size:18px;margin:8px 0}.buy{width:100%;border:0;background:#7d284f;color:#fff;border-radius:10px;padding:11px;font-weight:800}.cart{position:fixed;right:15px;bottom:18px;background:#7d284f;color:#fff;border-radius:50px;padding:14px 17px;box-shadow:0 8px 25px #7d284f55;z-index:8}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.sheet{background:white;width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px}.sheet h2{margin-top:0}.row{display:flex;gap:8px}.field{margin:8px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #dfc8d2;border-radius:10px}.line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}.submit{width:100%;padding:14px;border:0;border-radius:12px;background:#7d284f;color:white;font-weight:900;margin-top:10px}.close{float:right;border:0;background:#eee;border-radius:50%;width:34px;height:34px}.empty{text-align:center;padding:40px;color:#777}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.hero h1{font-size:44px}.sheet{width:600px;margin:0 auto 20px;border-radius:22px}.modal{align-items:center}.wrap{padding:28px 20px}}
</style></head><body><header class="top"><div class="brand">GHIR9ELBL7ABA</div><div class="sub">THRIFT • VINTAGE • ONE PIECE</div></header><main class="wrap"><section class="hero"><h1>Find your next vintage piece.</h1><p>Des pièces uniques sélectionnées une par une.</p></section><div class="tools" id="cats"></div><div class="grid" id="grid"></div></main><button class="cart" onclick="openCart()">🛍️ Panier <span id="count">0</span></button><div class="modal" id="modal"><div class="sheet"><button class="close" onclick="closeCart()">×</button><h2>Votre commande</h2><div id="cartLines"></div><div class="field"><label>Nom complet *</label><input id="name"></div><div class="field"><label>Téléphone *</label><input id="phone" inputmode="tel"></div><div class="row"><div class="field" style="flex:1"><label>Wilaya *</label><input id="wilaya"></div><div class="field" style="flex:1"><label>Commune *</label><input id="commune"></div></div><div class="field"><label>Adresse / point de livraison *</label><textarea id="address" rows="3"></textarea></div><div class="field"><label>Livraison</label><select id="delivery"><option>Livraison à domicile</option><option>Point de retrait</option></select></div><div id="total" style="font-weight:900;font-size:20px;margin-top:10px"></div><button class="submit" onclick="submitOrder()">CONFIRMER LA COMMANDE</button><div id="result"></div></div></div><script>
let products=[],cart=[],cat='All';
const money=n=>Number(n).toLocaleString('fr-DZ')+' DA';
async function load(){const r=await fetch('/api/products');products=await r.json();renderCats();render();}
function renderCats(){let cats=['All',...new Set(products.map(p=>p.category).filter(Boolean))];document.getElementById('cats').innerHTML=cats.map(x=>'<button class="'+(x===cat?'active':'')+'" onclick="setCat('+JSON.stringify(x)+')">'+x+'</button>').join('')}
function setCat(x){cat=x;renderCats();render()}
function render(){let ps=cat==='All'?products:products.filter(p=>p.category===cat);document.getElementById('grid').innerHTML=ps.length?ps.map(p=>'<article class="card"><div class="pic">'+(p.image?'<img src="'+p.image+'">':'<span>GHIR9ELBL7ABA</span>')+'<span class="tag">'+(p.size||'ONE SIZE')+'</span></div><div class="info"><div class="brandx">'+(p.brand||'Vintage')+'</div><div class="name">'+p.name+'</div><div class="meta">'+(p.description||'Pièce unique')+'</div><div class="price">'+money(p.price)+'</div><button class="buy" onclick="add('+p.id+')">AJOUTER AU PANIER</button></div></article>').join(''):'<div class="empty" style="grid-column:1/-1">Aucune pièce disponible pour le moment.</div>'}
function add(id){let p=products.find(x=>x.id===id);if(!p)return;let q=cart.find(x=>x.id===id);if(q)q.qty++;else cart.push({id,qty:1});updateCount();openCart()}
function updateCount(){document.getElementById('count').textContent=cart.reduce((s,x)=>s+x.qty,0)}
function openCart(){document.getElementById('modal').style.display='flex';drawCart()}function closeCart(){document.getElementById('modal').style.display='none'}
function drawCart(){let lines=document.getElementById('cartLines');if(!cart.length){lines.innerHTML='<div class="empty">Panier vide.</div>';document.getElementById('total').textContent='';return}let total=0;lines.innerHTML=cart.map(x=>{let p=products.find(y=>y.id===x.id);total+=p.price*x.qty;return '<div class="line"><span>'+p.name+' × '+x.qty+'</span><b>'+money(p.price*x.qty)+'</b></div>'}).join('');document.getElementById('total').textContent='Total: '+money(total)}
async function submitOrder(){if(!cart.length)return alert('Votre panier est vide.');let payload={customer_name:name.value.trim(),phone:phone.value.trim(),wilaya:wilaya.value.trim(),commune:commune.value.trim(),address:address.value.trim(),delivery:delivery.value,items:cart.map(x=>({product_id:x.id,qty:x.qty}))};if(!payload.customer_name||!payload.phone||!payload.wilaya||!payload.commune||!payload.address)return alert('كملي المعلومات كامل.');let r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});let d=await r.json();if(!r.ok)return alert(d.error||'Erreur');cart=[];updateCount();result.innerHTML='<div style="margin-top:15px;padding:15px;background:#f4eaf0;border-radius:12px"><b>Commande confirmée ✅</b><br>Numéro: <b>'+d.order_no+'</b><br>Total: <b>'+money(d.total)+'</b></div>';await load()}
load();
</script></body></html>
