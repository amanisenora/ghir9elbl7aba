<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GHIR9ELBL7ABA — Thrift & Vintage</title><style>
:root{--wine:#5b1735;--pink:#f5dbe4;--cream:#fffaf7;--ink:#24171d;--gold:#b98a46}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}header{background:var(--wine);color:white;padding:18px 16px;position:sticky;top:0;z-index:5}header .top{display:flex;justify-content:space-between;align-items:center;gap:10px}.logo{font-weight:900;letter-spacing:2px;font-size:20px}.cart{border:1px solid #fff6;padding:9px 12px;border-radius:999px;background:#ffffff12;color:#fff}.hero{padding:28px 16px;background:linear-gradient(135deg,#f6dce5,#fff8f5)}.hero h1{margin:0;font-size:34px;letter-spacing:-1px}.hero p{margin:8px 0 0}.search{margin:16px}.search input{width:100%;padding:14px;border:1px solid #d9cbd0;border-radius:14px;font-size:16px}.cats{display:flex;gap:8px;overflow:auto;padding:0 16px 12px}.cat{white-space:nowrap;border:1px solid #d5bfc7;background:white;border-radius:999px;padding:9px 13px}.cat.active{background:var(--wine);color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px}.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 3px 15px #4a263311}.pic{aspect-ratio:1/1.1;background:#eee;display:flex;align-items:center;justify-content:center}.pic img{width:100%;height:100%;object-fit:cover}.noimg{font-size:34px;color:#8a6b76}.info{padding:11px}.brand{font-size:11px;text-transform:uppercase;color:#866a74;letter-spacing:1px}.name{font-weight:700;margin:4px 0}.meta{font-size:12px;color:#765e67}.price{font-weight:900;margin-top:8px}.buy{width:100%;border:0;background:var(--wine);color:#fff;padding:11px;border-radius:10px;margin-top:9px;font-weight:700}.empty{text-align:center;padding:50px 20px;color:#765e67}.drawer{position:fixed;inset:0;background:#0008;display:none;z-index:20}.panel{position:absolute;right:0;top:0;height:100%;width:min(440px,100%);background:#fff;padding:18px;overflow:auto}.close{float:right;border:0;background:none;font-size:26px}.item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.item img{width:65px;height:75px;object-fit:cover;border-radius:8px}.checkout input,.checkout textarea,.checkout select{width:100%;padding:12px;margin:5px 0 10px;border:1px solid #d7c8ce;border-radius:10px}.checkout button{width:100%;padding:13px;border:0;border-radius:10px;background:var(--wine);color:white;font-weight:700}.success{padding:25px;background:#f0f8f1;border-radius:15px;margin-top:15px}footer{text-align:center;padding:35px;color:#8a6b76}@media(min-width:800px){.grid{grid-template-columns:repeat(4,1fr);max-width:1200px;margin:auto}.hero,.search,.cats{max-width:1200px;margin-left:auto;margin-right:auto}}
</style></head><body><header><div class="top"><div class="logo">GHIR9ELBL7ABA</div><button class="cart" onclick="openCart()">🛍 Panier <span id="count">0</span></button></div></header><section class="hero"><h1>THRIFT & VINTAGE</h1><p>Des pièces uniques, soigneusement sélectionnées.</p></section><div class="search"><input id="search" placeholder="Rechercher une pièce..." oninput="render()"></div><div id="cats" class="cats"></div><main id="products" class="grid"></main><footer>GHIR9ELBL7ABA • Thrift & Vintage</footer><div id="drawer" class="drawer" onclick="if(event.target.id==='drawer')closeCart()"><div class="panel"><button class="close" onclick="closeCart()">×</button><h2>Ton panier</h2><div id="cartItems"></div><div id="checkout"></div></div></div><script>
let products=[],cart=[],active='All';const $=id=>document.getElementById(id);function money(n){return new Intl.NumberFormat('fr-DZ').format(n)+' DA'}
async function load(){const r=await fetch('/api/products');products=await r.json();cats();render()}function cats(){const c=['All',...new Set(products.map(p=>p.category).filter(Boolean))];$('cats').innerHTML=c.map(x=>`<button class="cat ${x===active?'active':''}" onclick="active=${JSON.stringify(x)};cats();render()">${x}</button>`).join('')}
function render(){const q=$('search').value.toLowerCase();const list=products.filter(p=>(active==='All'||p.category===active)&&(`${p.brand} ${p.name} ${p.size}`.toLowerCase().includes(q)));$('products').innerHTML=list.length?list.map(p=>`<article class="card"><div class="pic">${p.image?`<img src="${p.image}" alt="${esc(p.name)}">`:'<div class="noimg">✦</div>'}</div><div class="info"><div class="brand">${esc(p.brand)}</div><div class="name">${esc(p.name)}</div><div class="meta">Taille: ${esc(p.size||'—')}</div><div class="price">${money(p.price)}</div><button class="buy" onclick="add(${p.id})">Commander</button></div></article>`).join(''):'<div class="empty">Aucune pièce disponible pour le moment.</div>'}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function add(id){const p=products.find(x=>x.id===id);if(!p)return;const x=cart.find(i=>i.product_id===id);if(x)x.qty++;else cart.push({product_id:id,qty:1});updateCount();openCart()}
function updateCount(){$('count').textContent=cart.reduce((s,i)=>s+i.qty,0)}function openCart(){$('drawer').style.display='block';drawCart()}function closeCart(){$('drawer').style.display='none'}function drawCart(){if(!cart.length){$('cartItems').innerHTML='<p>Panier vide.</p>';$('checkout').innerHTML='';return}let total=0;$('cartItems').innerHTML=cart.map(i=>{const p=products.find(x=>x.id===i.product_id);total+=p.price*i.qty;return `<div class="item">${p.image?`<img src="${p.image}">`:''}<div><b>${esc(p.name)}</b><br>${i.qty} × ${money(p.price)}<br><button onclick="dec(${p.id})">−</button> <button onclick="add(${p.id})">+</button></div></div>`}).join('');$('checkout').innerHTML=`<h3>Total: ${money(total)}</h3><form class="checkout" onsubmit="order(event)"><input name="customer_name" placeholder="Nom et prénom *" required><input name="phone" placeholder="Téléphone *" required><input name="wilaya" placeholder="Wilaya *" required><input name="commune" placeholder="Commune *" required><textarea name="address" placeholder="Adresse / point de livraison *" required></textarea><select name="delivery"><option value="home">Livraison à domicile</option><option value="pickup">Point de retrait</option></select><button>Confirmer la commande</button></form>`}
function dec(id){const x=cart.find(i=>i.product_id===id);if(!x)return;x.qty--;if(x.qty<=0)cart=cart.filter(i=>i.product_id!==id);updateCount();drawCart()}
async function order(e){e.preventDefault();const f=new FormData(e.target);const body=Object.fromEntries(f.entries());body.items=cart;const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok){alert(d.error||'Erreur');return}cart=[];updateCount();await load();$('cartItems').innerHTML=`<div class="success"><h3>Commande confirmée ✨</h3><p>Numéro: <b>${d.order_no}</b></p><p>Total: <b>${money(d.total)}</b></p><p>On va traiter ta commande.</p></div>`;$('checkout').innerHTML=''}load();
</script></body></html>
